name: Prettier appearance debug

on:
  push:
    branches:
      - tmp/prettier-appearance-debug

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/components/appearance-provider.tsx
      - run: git diff --no-ext-diff -- src/components/appearance-provider.tsx
